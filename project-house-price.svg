  <rect x="208" y="102" width="73" height="20" rx="10" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/><text x="244.5" y="116" text-anchor="middle" font-size="10.5" fill="#C4B5FD">Streamlit</text>
