<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160" role="img" aria-label="House Price Predictor project card" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace">
  <title>House Price Predictor</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <clipPath id="card"><rect width="400" height="160" rx="10"/></clipPath>
